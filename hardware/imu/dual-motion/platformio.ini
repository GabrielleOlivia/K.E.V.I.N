; Separate proof-of-concept for two already-identified BHI360 IMUs on SAMD21 SensorHub.
; Does not modify hardware/imu/diagnostics or the pressure firmware.
[env:adafruit_feather_m0_express]
platform = atmelsam
board = adafruit_feather_m0_express
framework = arduino
monitor_speed = 115200
build_flags =
  -D KEVIN_DUAL_BHI360_MOTION=1
; upload_port = COM3
; monitor_port = COM3
