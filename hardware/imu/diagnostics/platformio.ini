; Standalone diagnostics for existing RobotPatient SAMD21 SensorHub.
; IMPORTANT: do not replace the root K.E.V.I.N. platformio.ini.
[env:adafruit_feather_m0_express]
platform = atmelsam
board = adafruit_feather_m0_express
framework = arduino
monitor_speed = 115200
build_flags = -D KEVIN_IMU_DIAGNOSTIC=1
; Set upload_port/monitor_port only if auto detection fails.
; upload_port = COM3
; monitor_port = COM3
