; Combined pressure + read-only BHI360 ID integration on ModularSim SAMD21.
; Open THIS directory as the PlatformIO project; do not build root/src or
; hardware/imu/dual-motion here.
[env:adafruit_feather_m0_express]
platform = atmelsam
board = adafruit_feather_m0_express
framework = arduino
monitor_speed = 115200

; No Bosch SensorAPI and no firmware upload to either BHI360 in this project.
; Pin map is checked in src/main.cpp before any I2C operation.
