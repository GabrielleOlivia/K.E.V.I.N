; STM32F405 pressure-only probe on proven Port A upper I2C1.
; NOT Port B. Do not connect pressure's five-wire jumper harness.
; Use a VERIFIED matching four-pin keyed cable; disconnect USB to swap modules.
; Pressurization input is a bench syringe only. Raw ADC counts are not pressure units.
[env:micromod_f405_pressure_porta]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
monitor_speed = 115200
; SAFETY HOLD (2026-11-17): Pressure transducer MPXV5010GP requires
; 4.75-5.25V. Port A upper's proved switched rail is 3.3V. The test
; must remain non-energizing until the actual pressure module's 5V
; power + I2C level arrangement and pin order are established.
; See README.md before any flashing.
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D KEVIN_PRESSURE_PORTA_ELECTRICAL_VERIFIED=0

; No implicit upload target. Program deliberately via STM32CubeProgrammer DFU.
