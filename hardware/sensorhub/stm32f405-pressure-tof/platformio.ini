; K.E.V.I.N. STM32F405 isolated MCP3426 pressure-ADC diagnostic.
; ToF disconnected and disabled; ONLY Port A lower would be used.
; Newer v1.1.0b PCB suggests lower port: GND / switched 3.3V / SCL1 / SDA1,
; STM32 PC13 switched rail, PB6 SCL, PB7 SDA, I2C1 address 0x68.
; The actual carrier is v1.0.3; pin order has not been verified.
; IMPORTANT: this port's 3.3V does NOT meet MPXV5010GP 4.75-5.25V supply.
; No pressure sensing/calibration may be claimed on this port alone.
; PRESSURE OFF BY DEFAULT until v1.0.3 pad order, rail & logic levels verified.
[env:micromod_f405_pressure_tof]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D KEVIN_TOF_IO_ENABLED=0
    -D KEVIN_PRESSURE_IO_ENABLED=0
    -D KEVIN_PRESSURE_A_LOWER_PINOUT_VERIFIED=0

; If and ONLY IF the complete module/cable pinout and levels are confirmed,
; set BOTH pressure flags above to 1 to run I2C/ADC diagnostics on this port.
; This does NOT supply 5V to the pressure transducer. Verify it separately.
; No auto upload. Use STM32CubeProgrammer DFU if enabled/tested safely.
