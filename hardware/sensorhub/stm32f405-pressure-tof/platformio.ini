; Experimental alternate I2C routing for pressure (next to ToF).
; This is a PREPARATION branch, not permission to move live wires.
; Both Port A sockets share I2C1 (PB7 SDA, PB6 SCL). ToF stays A upper.
; Pressure's 5V transducer supply cannot be obtained from A lower's 3.3V.
; Pressure stays OFF until voltage compatibility and signal reroute verified.
[env:micromod_f405_pressure_tof]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D KEVIN_TOF_IO_ENABLED=1
    -D KEVIN_PRESSURE_IO_ENABLED=0
    -D KEVIN_PRESSURE_I2C1_SIGNAL_REWIRE_VERIFIED=0
    -D KEVIN_CARRIER_V103_PORT_B_VERIFIED=1
    -D KEVIN_PRESSURE_INTERFACE_VERIFIED=1

; ONLY after checking actual A-lower signal positions and compatible logic:
; set both pressure flags to 1, keep the verified 5V and 3.3V supplies and
; grounds from the approved pressure power arrangement. DO NOT connect 5V
; to the Port A lower 3.3V contact. No automatic upload.
