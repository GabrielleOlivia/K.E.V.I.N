; K.E.V.I.N. isolated pressure ADC bench diagnostic — UPPER Port A.
; ToF physically disconnected and its firmware IO disabled.
; Earlier VL6180X on upper Port A functionally verified PB7 SDA / PB6 SCL
; and switched 3.3V rail PC9 on user's actual STM32 carrier v1.0.3.
; This DOES NOT verify the pressure PCB/cable's matching 4-pin power/GND order,
; its I2C signal voltage, nor MPXV5010GP's required 4.75–5.25V supply.
; A keyed four-contact cable can mechanically fit yet be electrically wrong.
; Enable power only after connector signals and voltage levels are checked.
[env:micromod_f405_pressure_tof]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D KEVIN_TOF_IO_ENABLED=0
    -D KEVIN_PRESSURE_IO_ENABLED=1
    -D KEVIN_PRESSURE_A_UPPER_PINOUT_VERIFIED=1

; Verification macro is a BUILD OPT-IN, not hardware proof. Check cable
; orientation, power/GND and 3.3V SDA/SCL compatibility independently first.
; Diagnostic measures MCP3426 I2C ACK and raw ADC counts only, not verified
; physiological or calibrated pressure. No transducer test without rated 5V.
; Do not apply 5V to upper Port A 3.3V or I2C pins. No auto upload.
