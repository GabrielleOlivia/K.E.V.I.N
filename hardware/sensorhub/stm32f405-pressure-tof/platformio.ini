; Experimental alternate I2C routing for pressure (next to ToF).
; This is a PREPARATION branch, not permission to move live wires.
; Both Port A sockets share I2C1 (PB7 SDA, PB6 SCL). ToF stays A upper.
; Pressure's 5V transducer supply cannot be obtained from A lower's 3.3V.
; Bench mode: both sensors enabled after user reports wiring complete.
; USE ONLY after confirming pressure transducer's proper 5V feed and
; that pressure SDA/SCL are 3.3V-compatible on shared I2C1.
; The two pressure flags below are *declarations*, not voltage tests.
[env:micromod_f405_pressure_tof]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D KEVIN_TOF_IO_ENABLED=1
    -D KEVIN_PRESSURE_IO_ENABLED=1
    -D KEVIN_PRESSURE_I2C1_SIGNAL_REWIRE_VERIFIED=1
    -D KEVIN_CARRIER_V103_PORT_B_VERIFIED=1
    -D KEVIN_PRESSURE_INTERFACE_VERIFIED=1

; STOP before powering if only connector fit (not power/logic levels)
; was checked. Pressure 5V supply & common GND must stay valid.
; DO NOT connect 5V to A lower 3.3V or STM32 SDA/SCL. No auto upload.
; On this bench route PC8 drives pressure's switched 3.3V rail, PC9 ToF 3.3V.
; PC13 (lower Port A 3.3V rail) intentionally untouched (SDA/SCL only).
