; K.E.V.I.N. STM32F405 pressure + VL6180X simultaneous bench test.
; Users confirmed the Port B signal/supply mapping and both sensors connected.
; Reference schematics are from v1.1.0b; actual carrier is v1.0.3.
; *** ONLY FLASH IF USER'S CHECK INCLUDED SUPPLY VOLTAGES + PIN ORDER: ***
; MPXV5010GP pressure IC needs 4.75-5.25V on its actual power input,
; while STM32 I2C SDA/SCL must not be pulled above allowed logic level.
; ToF stays on the already-proven Port A upper / I2C1 / PC9.
; Pressure MCP3426 uses Port B / I2C2 / PC8 as user-confirmed wiring.
[env:micromod_f405_pressure_tof]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D KEVIN_TOF_IO_ENABLED=1
    -D KEVIN_PRESSURE_IO_ENABLED=1
    -D KEVIN_CARRIER_V103_PORT_B_VERIFIED=1
    -D KEVIN_PRESSURE_INTERFACE_VERIFIED=1

; No automatic upload configured. Use STM32CubeProgrammer DFU deliberately.
; The earlier working ToF-only firmware and 1MiB flash backup remain intact
; on the separate feature/stm32f405-pressure-tof-integration branch and disk.
