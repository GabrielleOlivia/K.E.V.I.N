; K.E.V.I.N. STM32F405 pressure + VL6180X integrated bench diagnostic
; The photographed SensorHub is v1.0.3, not the documented v1.1.0b.
; SAFE TEST MODE: enable physically proven ToF on Port A upper only.
; Pressure Port B remains disabled, no I2C2 or power rail manipulation.
; FOR TEST: disconnect the pressure jumper harness with USB power OFF.
[env:micromod_f405_pressure_tof]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D KEVIN_TOF_IO_ENABLED=1
    -D KEVIN_PRESSURE_IO_ENABLED=0

; NEVER UPLOAD until board pinout and supply interfaces are confirmed.
; Do not add a DFU upload protocol until reviewing backup/recovery steps.
