; K.E.V.I.N. STM32F405 isolated MCP3426 pressure-ADC diagnostic.
; ToF disconnected and disabled; ONLY Port A lower would be used.
; Newer v1.1.0b PCB suggests lower port: GND / switched 3.3V / SCL1 / SDA1,
; STM32 PC13 switched rail, PB6 SCL, PB7 SDA, I2C1 address 0x68.
; The actual carrier is v1.0.3; pin order has not been verified.
; IMPORTANT: this port's 3.3V does NOT meet MPXV5010GP 4.75-5.25V supply.
; No pressure sensing/calibration may be claimed on this port alone.
; Bench branch has pressure I2C ENABLED after user fitted the correct keyed cable.
; THIS FLAG IS NOT EVIDENCE OF ELECTRICAL VERIFICATION: confirm actual
; v1.0.3 connector order and voltage levels independently before flashing.
[env:micromod_f405_pressure_tof]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
monitor_speed = 115200
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D KEVIN_TOF_IO_ENABLED=0
    -D KEVIN_PRESSURE_IO_ENABLED=1
    -D KEVIN_PRESSURE_A_LOWER_PINOUT_VERIFIED=1

; This is an MCP3426 communication/ADC bench test, not valid MPXV5010GP
; pressure sensing unless the transducer's specified 5V is provided through
; a verified safe supply arrangement. Do NOT connect external 5V to A lower
; 3.3V pin or STM32 SDA/SCL. No auto upload; use STM32CubeProgrammer DFU
; only after safe wiring verification.
