; Standalone K.E.V.I.N. SAMD21 combined pressure A2 + ToF B2 bench diagnostic.
; Both I2C buses: separate SERCOM1 and SERCOM2. No BHI IMUs attached.
[platformio]
default_envs = adafruit_feather_m0_express

[env]
platform = atmelsam@9.0.0
board = adafruit_feather_m0_express
framework = arduino
monitor_speed = 115200
monitor_filters =
    send_on_enter

[env:adafruit_feather_m0_express]
build_src_filter = +<main.cpp>

[env:a2_reachability]
build_src_filter = +<a2_reachability.cpp>


; Experimental three-module live acquisition with Bosch BHI360 firmware.
; This does NOT replace the proven bench firmware selected above.
; First run: py -3 scripts/vendor_bhi360.py
[env:kevin_live_sensors]
build_src_filter = +<main_live.cpp>
lib_ldf_mode = deep+
; The official BSD-licensed SensorAPI and firmware header must be installed
; into lib/BHI360Vendor by the explicit vendor script before compilation.
