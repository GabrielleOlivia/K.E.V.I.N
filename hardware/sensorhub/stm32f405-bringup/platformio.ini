; K.E.V.I.N. / STM32F405RG SensorHub MicroMod carrier bring-up.
; Companion to existing SAMD21 firmware. Do NOT upload until physical
; board identity, existing firmware backup, and programmer path are confirmed.
; Reference: OlympusSixtems/KEVIN branch feature/stm32f405-vl6180x-tof-probe.
[env:micromod_f405_usb_only]
platform = ststm32
board = sparkfun_micromod_f405
framework = arduino
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
monitor_speed = 115200

; No upload_protocol selected here. PlatformIO board default is ST-LINK.
; The hardware's existing USB firmware may be Zephyr; building this program
; neither proves USB DFU access nor preserves the installed image.
; Only configure a flashing protocol after explicitly backing up firmware.
