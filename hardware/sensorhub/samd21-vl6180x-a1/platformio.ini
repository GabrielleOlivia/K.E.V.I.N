; K.E.V.I.N. standalone SAMD21 VL6180X Sensor A1 live distance test.
; Same previously verified Feather M0 Express PA16 SDA / PA17 SCL bus.
; Uses copied proven STM32 VL6180X Arduino TwoWire driver in include/.
; This mode initializes the sensor (unlike previous read-only ID test).
[env:adafruit_feather_m0_express]
platform = atmelsam
board = adafruit_feather_m0_express
framework = arduino
monitor_speed = 115200
monitor_filters =
    send_on_enter
