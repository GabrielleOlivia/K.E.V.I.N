; K.E.V.I.N. PHYSICAL B2 SECOND IMU ONLY. No other sensors should be connected.
; SAMD21 on Feather M0 Express variant; SERCOM2 PA12/PA13.
[platformio]
default_envs = b2_imu_id_only

[env]
platform = atmelsam@9.0.0
board = adafruit_feather_m0_express
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, log2file

; SAFE FIRST STAGE. Does not reset, configure or upload firmware to either IMU IC.
[env:b2_imu_id_only]
build_flags = -D KEVIN_ID_ONLY=1
build_src_filter = +<main.cpp>

; OPT-IN SECOND STAGE. Requires vendor script. Bosch firmware is written to
; BHI360 internal RAM only after BOTH chip IDs match.
[env:b2_imu_accel]
build_src_filter = +<main.cpp>
lib_ldf_mode = deep+
