name: Sensor integration host tests
on: [push, pull_request]
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-serial.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q kevin tests
# Assumes this package is the repository root. Adjust working-directory if
# incorporated as an integration/ subfolder in the existing pressure repository.
