name: K.E.V.I.N. live-sensor code checks
on:
  push:
    branches:
      - feature/live-physical-sensors-v0.2
  workflow_dispatch:
jobs:
  python-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m compileall -q software/kevin_patient_simulator
      - name: Run offline simulation tests
        run: python -m unittest discover -s software/kevin_patient_simulator/tests -v
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Install Bosch SensorAPI and original firmware from official upstream
        working-directory: hardware/sensorhub/samd21-pressure-a2-tof-b2
        run: python scripts/vendor_bhi360.py
      - name: Compile experimental three-module SAMD21 firmware
        working-directory: hardware/sensorhub/samd21-pressure-a2-tof-b2
        run: pio run -e kevin_live_sensors
      - name: Compile backed-up scanner firmware (regression)
        working-directory: hardware/sensorhub/samd21-pressure-a2-tof-b2
        run: pio run -e adafruit_feather_m0_express
